# ============================================================
# SERVIDOR
# ============================================================
spring.application.name=backend
server.port=8080

# ============================================================
# POSTGRESQL - CONEXIÓN
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/refacciones_db
spring.datasource.username=postgres
spring.datasource.password=12345678
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / HIBERNATE
# ============================================================
# validate  -> verifica que las entidades coincidan con la BD
# update    -> actualiza la BD si hay cambios en las entidades
# create    -> borra y recrea las tablas al iniciar (borra datos)
# none      -> no hace nada (usamos el schema.sql manual)
spring.jpa.hibernate.ddl-auto=validate

# Muestra las consultas SQL en consola (útil para desarrollo)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# SPRING SECURITY - SESIÓN
# ============================================================
# Tiempo de expiración de la sesión (30 minutos)
server.servlet.session.timeout=30m

# Cookie de sesión solo accesible por HTTP (no desde JavaScript)
server.servlet.session.cookie.http-only=true

# ============================================================
# CORS - Permite peticiones desde React (puerto 3000 de CRA)
# ============================================================
spring.web.cors.allowed-origins=http://localhost:3000

# ============================================================
# LOGS
# ============================================================
logging.level.com.refacciones=DEBUG
